
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow - Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>WeatherNow</h1>
            <p>Real-Time Weather Forecast</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button id="searchButton">Search</button>
        </div>

        <p id="message"></p>

        <section class="weather-card">

            <div class="location">
                <h2 id="cityName">Search Your City</h2>
                <p id="date">Current Weather</p>
            </div>

            <div class="current-weather">
                <div class="weather-info">
                    <img id="weatherIcon" src="" alt="Weather Icon">
                    <h1 id="temperature">--°C</h1>
                    <p id="weatherCondition">Weather Condition</p>
                </div>

                <div class="weather-details">
                    <div class="detail-box">
                        <span>Humidity</span>
                        <h3 id="humidity">--%</h3>
                    </div>

                    <div class="detail-box">
                        <span>Wind Speed</span>
                        <h3 id="windSpeed">-- m/s</h3>
                    </div>

                    <div class="detail-box">
                        <span>Pressure</span>
                        <h3 id="pressure">-- hPa</h3>
                    </div>
                </div>
            </div>

        </section>

        <section class="forecast-section">
            <h2>5-Day Forecast</h2>
            <div class="forecast-container" id="forecastContainer">
                <p>Search a city to see its forecast.</p>
            </div>
        </section>

        <footer>
            <p>Weather data powered by OpenWeatherMap</p>
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
